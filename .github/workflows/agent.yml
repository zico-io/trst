name: Agent

on:
  push:
    branches: [main]
    paths:
      - 'apps/agent/**'
      - 'packages/db/src/**'
      - 'packages/shared/src/**'
      - '.github/workflows/agent.yml'

# One deploy at a time; never cancel a running deploy.
concurrency:
  group: agent-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REPOSITORY: trst-agent
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="$ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com"
          docker build \
            -f apps/agent/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Register new task definition
        id: task-def
        env:
          CLUSTER: trst-production
          SERVICE: trst-agent-production
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          # Fetch current task def, replace image, register new revision
          TASK_FAMILY=$(aws ecs describe-services \
            --cluster $CLUSTER \
            --services $SERVICE \
            --query 'services[0].taskDefinition' \
            --output text | sed 's/:[0-9]*$//')
          CURRENT=$(aws ecs describe-task-definition \
            --task-definition $TASK_FAMILY \
            --query 'taskDefinition')
          NEW=$(echo $CURRENT | jq --arg img "$IMAGE" \
            '.containerDefinitions[0].image = $img |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                 .compatibilities, .registeredAt, .registeredBy)')
          ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        env:
          CLUSTER: trst-production
          SERVICE: trst-agent-production
          TASK_DEF_ARN: ${{ steps.task-def.outputs.task_def_arn }}
        run: |
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --task-definition $TASK_DEF_ARN
          aws ecs wait services-stable \
            --cluster $CLUSTER \
            --services $SERVICE
