name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun turbo lint

      - name: Typecheck
        run: bun turbo typecheck

      - name: Build
        run: bun turbo build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trst
